[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-project-module"
version = "0.1.0"
description = "범용 Prompt Engineering 및 RAG 프로젝트를 위한 재사용 가능한 기본 골격"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Developer", email = "dev@example.com"}
]

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Streamlit UI
streamlit = [
    "streamlit>=1.28.1",
    "requests>=2.31.0",
]

# FastAPI REST API
api = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
]

# LLM Providers
openai = [
    "openai>=1.3.0",
]
anthropic = [
    "anthropic>=0.7.0",
]
google = [
    "google-generativeai>=0.3.0",
]
local = [
    "ollama>=0.1.0",
]

# Vector Stores & Embeddings
faiss = [
    "faiss-cpu>=1.7.4",
]
chroma = [
    "chromadb>=0.4.0",
]
qdrant = [
    "qdrant-client>=2.7.0",
]
pinecone = [
    "pinecone-client>=3.0.0",
]
embeddings = [
    "sentence-transformers>=2.2.0",
]

# RAG & Retrieval
rag = [
    "langchain>=0.1.0",
]

# Dev & Testing
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

# All dependencies
all = [
    "llm-project-module[streamlit,api,openai,anthropic,google,local,faiss,chroma,qdrant,pinecone,embeddings,rag,dev]"
]

[project.urls]
Homepage = "https://github.com/yourusername/llm-project-module"
Repository = "https://github.com/yourusername/llm-project-module"
Documentation = "https://github.com/yourusername/llm-project-module/wiki"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long
    "E203",   # whitespace before ':'
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

